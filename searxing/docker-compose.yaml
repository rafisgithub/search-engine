# SearXNG — privacy-respecting metasearch engine.
# Upstream: https://github.com/searxng/searxng
# Docs:     https://docs.searxng.org/admin/installation-docker.html
#
# NOTE: the old `searxng/searxng-docker` repo is deprecated. This follows the
# current layout from `searxng/container/`.
#
#   docker compose up -d      # UI on http://localhost:8080
#   docker compose logs -f core
#
# On first start the entrypoint writes ./core-config/settings.yml with a freshly
# generated secret_key. Edit that file to configure engines, then restart.

name: searxing

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      # Host/port come from .env; defaults to 8080 on all interfaces.
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    volumes:
      # :Z relabels for SELinux hosts; harmless elsewhere.
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    container_name: searxng-valkey
    # Backs the rate limiter and bot-detection state. Redis-compatible.
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  core-data:
  valkey-data:
